name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: researchreach
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchreach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://researchreach:test@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://researchreach:test@127.0.0.1:5432/postgres
      RUN_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/check-no-user-resume.mjs
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
